[project]
name = "clipdown"
version = "0.1.0"
description = "A focused macOS desktop interface for yt-dlp"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8",
  "yt-dlp[default]>=2025.11.12",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.11"]

[project.scripts]
clipdown = "clipdown.main:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clipdown*"]
